name: Playwright Full Debug

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Requirements
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install playwright
          fi

      - name: Install Chromium
        run: |
          python -m playwright install chromium

      - name: Create Debug Files
        run: |
          touch status.txt
          touch output.txt
          touch title.txt
          echo "========== PLAYWRIGHT DEBUG ==========" > status.txt
          echo "Start Time: $(date)" >> status.txt
          echo "" >> status.txt

      - name: Run Python Script
        run: |
          python main.py >> status.txt 2>&1 || true

      - name: Repository File List
        run: |
          echo "" >> status.txt
          echo "========== REPOSITORY FILES ==========" >> status.txt
          ls -lah >> status.txt

      - name: Show Status Log
        run: |
          echo "===== STATUS.TXT ====="
          cat status.txt || true
          echo ""
          echo "===== TITLE.TXT ====="
          cat title.txt || true
          echo ""
          echo "===== OUTPUT.TXT ====="
          cat output.txt || true

      - name: Upload Debug Files
        uses: actions/upload-artifact@v4
        with:
          name: Debug-Logs
          path: |
            status.txt
            output.txt
            title.txt
            page.html
            cloudflare.png

      - name: Finished
        run: echo "Workflow Completed Successfully"
