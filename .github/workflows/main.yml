name: Playwright

on: [workflow_dispatch]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
      - run: playwright install chromium
      - run: python main.py

      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: output.txt
