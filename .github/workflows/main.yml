name: Playwright Debug Full

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Requirements
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Playwright Browser
        run: |
          python -m playwright install chromium

      - name: Create Log Files
        run: |
          touch status.txt
          touch output.txt
          echo "========== PLAYWRIGHT DEBUG ==========" > status.txt
          echo "Workflow Started" >> status.txt
          echo "Time: $(date)" >> status.txt
          echo "" >> status.txt

      - name: Run Python Script
        run: |
          python main.py >> status.txt 2>&1 || true

      - name: Repository File List
        run: |
          echo "" >> status.txt
          echo "========== REPOSITORY FILES ==========" >> status.txt
          ls -lah >> status.txt

      - name: Show Status Log
        run: |
          cat status.txt
          echo ""
          echo "========== OUTPUT.TXT =========="
          cat output.txt || true

      - name: Upload Debug Files
        uses: actions/upload-artifact@v4
        with:
          name: Debug-Logs
          path: |
            status.txt
            output.txt
